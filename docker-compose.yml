name: chatcafe

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatcafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - chatcafe

  chatcafe-api:
    image: ${IMAGE_REGISTRY}/api:${IMAGE_TAG}
    container_name: chatcafe-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
      - media_data:/app/media
    networks:
      - chatcafe

  chatcafe-admin:
    image: ${IMAGE_REGISTRY}/admin:${IMAGE_TAG}
    container_name: chatcafe-admin
    restart: unless-stopped
    networks:
      - chatcafe

  chatcafe-client:
    image: ${IMAGE_REGISTRY}/client:${IMAGE_TAG}
    container_name: chatcafe-client
    restart: unless-stopped
    networks:
      - chatcafe

  gateway:
    image: ${IMAGE_REGISTRY}/gateway:${IMAGE_TAG}
    container_name: chatcafe-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chatcafe-api:
        condition: service_started
      chatcafe-admin:
        condition: service_started
      chatcafe-client:
        condition: service_started
    ports:
      - "${GATEWAY_PORT}:80"
    networks:
      - chatcafe

networks:
  chatcafe:
    name: chatcafe
    driver: bridge

volumes:
  pg_data:
  media_data:
