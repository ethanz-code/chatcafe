<?xml version="1.0" encoding="UTF-8"?>
<!--
  ChatCafe README Banner  v2
  ──────────────────────────
  Changes from v1:
    - 杯口椭圆 ry 9→6，杯型更秀气
    - 咖啡杯整体往中间挪（460-590 → 380-510），重心更稳
    - 对话气泡从 x=660 挪到 x=580，气泡尾巴真正贴上杯口
    - 文案 "> ask anything. brew ideas." → "> ask. brew ideas."（更短不溢出）
    - ✓ 气泡、波形、光点统一往左挪 70-100px，消除右侧大留白
    - 文字起始 x 重新计算，气泡内文字水平居中

  Total duration: ~6.3s, plays once then holds final state.
  Steam / waveform / dots use repeatCount="indefinite" for ambient motion.
  Pure SMIL — no CSS, no scripts, GitHub-camo safe.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ChatCafe — ask. brew ideas.">

  <defs>
    <radialGradient id="bg" cx="42%" cy="55%" r="80%">
      <stop offset="0%" stop-color="#3D2817"/>
      <stop offset="100%" stop-color="#1A1208"/>
    </radialGradient>

    <linearGradient id="cupBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C2A1"/>
      <stop offset="40%" stop-color="#E8B14C"/>
      <stop offset="100%" stop-color="#8B6F47"/>
    </linearGradient>

    <linearGradient id="bubbleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A1B0E" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#150D06" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#3D2817"/>
    </linearGradient>
  </defs>

  <!-- ======================== 背景 ======================== -->
  <rect width="1280" height="400" fill="url(#bg)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0s" fill="freeze"/>
  </rect>

  <!-- 远景几何线条（暗示数据流） -->
  <g stroke="#8B6F47" stroke-width="0.6" opacity="0">
    <animate attributeName="opacity" from="0" to="0.18" dur="1s" begin="0.4s" fill="freeze"/>
    <line x1="80"  y1="70"  x2="220" y2="95"/>
    <line x1="900" y1="60"  x2="1080" y2="85"/>
    <line x1="1040" y1="120" x2="1180" y2="100"/>
    <line x1="180" y1="160" x2="280" y2="180"/>
    <line x1="950" y1="180" x2="1080" y2="170"/>
  </g>

  <!-- 微小 AI 节点图标（左上） -->
  <g transform="translate(70,55)" opacity="0">
    <animate attributeName="opacity" from="0" to="0.55" dur="0.4s" begin="5.4s" fill="freeze"/>
    <circle r="4" fill="none" stroke="#C4956C" stroke-width="1"/>
    <circle r="1.2" fill="#E8B14C"/>
    <line x1="-10" y1="0" x2="-5" y2="0" stroke="#C4956C" stroke-width="0.6"/>
    <line x1="5"   y1="0" x2="10" y2="0" stroke="#C4956C" stroke-width="0.6"/>
    <line x1="0" y1="-10" x2="0" y2="-5" stroke="#C4956C" stroke-width="0.6"/>
    <line x1="0" y1="5"   x2="0" y2="10" stroke="#C4956C" stroke-width="0.6"/>
  </g>

  <!-- ======================== 吧台 ======================== -->
  <g id="counter">
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#8B6F47" stroke-width="1.5"
          stroke-dasharray="1280" stroke-dashoffset="1280">
      <animate attributeName="stroke-dashoffset" from="1280" to="0" dur="0.7s" begin="0.1s" fill="freeze"/>
    </line>
    <line x1="0" y1="345" x2="1280" y2="345" stroke="#8B6F47" stroke-width="0.5" opacity="0.4"
          stroke-dasharray="1280" stroke-dashoffset="1280">
      <animate attributeName="stroke-dashoffset" from="1280" to="0" dur="0.7s" begin="0.2s" fill="freeze"/>
    </line>
  </g>

  <!-- ======================== 吧台上的小物件 ======================== -->
  <g id="props">
    <!-- 翻开的书 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
      <path d="M 70 295 L 125 290 L 125 318 L 70 322 Z" fill="#F4C2A1" stroke="#8B6F47" stroke-width="1"/>
      <path d="M 125 290 L 180 295 L 180 322 L 125 318 Z" fill="#F4C2A1" stroke="#8B6F47" stroke-width="1"/>
      <line x1="85" y1="304" x2="115" y2="302" stroke="#8B6F47" stroke-width="0.5"/>
      <line x1="85" y1="310" x2="115" y2="308" stroke="#8B6F47" stroke-width="0.5"/>
      <line x1="85" y1="316" x2="110" y2="314" stroke="#8B6F47" stroke-width="0.5"/>
      <line x1="135" y1="302" x2="170" y2="304" stroke="#8B6F47" stroke-width="0.5"/>
      <line x1="135" y1="308" x2="170" y2="310" stroke="#8B6F47" stroke-width="0.5"/>
      <line x1="135" y1="314" x2="165" y2="316" stroke="#8B6F47" stroke-width="0.5"/>
    </g>

    <!-- 笔 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.65s" fill="freeze"/>
      <line x1="220" y1="308" x2="265" y2="298" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="265" y1="298" x2="273" y2="296" stroke="#C4956C" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="220" cy="308" r="1.5" fill="#8B6F47"/>
    </g>

    <!-- 咖啡豆 × 3 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.7s" fill="freeze"/>
      <ellipse cx="305" cy="312" rx="9" ry="5" fill="url(#beanGrad)" transform="rotate(20 305 312)"/>
      <path d="M 297 312 Q 305 308 313 312" stroke="#1A1208" stroke-width="0.6" fill="none" transform="rotate(20 305 312)"/>
      <ellipse cx="333" cy="316" rx="9" ry="5" fill="url(#beanGrad)" transform="rotate(-15 333 316)"/>
      <path d="M 325 316 Q 333 312 341 316" stroke="#1A1208" stroke-width="0.6" fill="none" transform="rotate(-15 333 316)"/>
      <ellipse cx="360" cy="311" rx="9" ry="5" fill="url(#beanGrad)" transform="rotate(35 360 311)"/>
      <path d="M 352 311 Q 360 307 368 311" stroke="#1A1208" stroke-width="0.6" fill="none" transform="rotate(35 360 311)"/>
    </g>
  </g>

  <!-- ======================== 咖啡杯 ======================== -->
  <g id="coffee-cup">
    <!-- 杯身（整体往左挪 80px → x 380-510） -->
    <path d="M 380 320 L 392 200 L 498 200 L 510 320"
          fill="url(#cupBody)" fill-opacity="0"
          stroke="#8B6F47" stroke-width="2.2" stroke-linejoin="round"
          stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" from="400" to="0" dur="0.7s" begin="0.8s" fill="freeze"/>
      <animate attributeName="fill-opacity" from="0" to="1" dur="0.8s" begin="1.7s" fill="freeze"/>
    </path>

    <!-- 杯把 -->
    <path d="M 505 225 Q 545 230 545 255 Q 545 280 505 285"
          fill="none" stroke="#8B6F47" stroke-width="2.2" stroke-linecap="round"
          stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" from="120" to="0" dur="0.4s" begin="1.2s" fill="freeze"/>
    </path>

    <!-- 杯口椭圆（ry 9 → 6，杯型更秀气） -->
    <ellipse cx="445" cy="200" rx="56" ry="6"
             fill="none" stroke="#8B6F47" stroke-width="2.2"
             stroke-dasharray="360" stroke-dashoffset="360">
      <animate attributeName="stroke-dashoffset" from="360" to="0" dur="0.4s" begin="1.5s" fill="freeze"/>
    </ellipse>

    <!-- 咖啡液面 -->
    <ellipse cx="445" cy="201" rx="52" ry="4.5" fill="#2A1208" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.9s" fill="freeze"/>
    </ellipse>

    <!-- 液面高光 -->
    <ellipse cx="430" cy="200" rx="12" ry="1.2" fill="#E8B14C" opacity="0">
      <animate attributeName="opacity" from="0" to="0.5" dur="0.3s" begin="2.0s" fill="freeze"/>
    </ellipse>
  </g>

  <!-- ======================== 蒸汽（持续，x 对齐新杯口 420/445/470） ======================== -->
  <g id="steam" stroke="#F5E6D3" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M 420 188 Q 415 165 425 145 Q 435 125 425 105">
      <animate attributeName="opacity" values="0;0.7;0.4;0" dur="1.8s" begin="2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 8; 0 -4" dur="1.8s" begin="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 445 188 Q 440 165 450 145 Q 460 125 450 100">
      <animate attributeName="opacity" values="0;0.85;0.5;0" dur="1.8s" begin="2.75s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 8; 0 -4" dur="1.8s" begin="2.75s" repeatCount="indefinite"/>
    </path>
    <path d="M 470 188 Q 465 165 475 145 Q 485 125 475 105">
      <animate attributeName="opacity" values="0;0.7;0.4;0" dur="1.8s" begin="2.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 8; 0 -4" dur="1.8s" begin="2.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ======================== 对话气泡 ======================== -->
  <g id="bubble">
    <!-- 主体圆角矩形：x 660→580，整体往左 80px -->
    <rect x="580" y="100" width="430" height="84" rx="22" ry="22"
          fill="url(#bubbleFill)" fill-opacity="0"
          stroke="#E8B14C" stroke-width="2"
          stroke-dasharray="1100" stroke-dashoffset="1100">
      <animate attributeName="stroke-dashoffset" from="1100" to="0" dur="0.6s" begin="3.0s" fill="freeze"/>
      <animate attributeName="fill-opacity" from="0" to="1" dur="0.4s" begin="3.6s" fill="freeze"/>
    </rect>

    <!-- 气泡尾巴：尖端直接贴到杯口（杯口右端 ~500, 198） -->
    <path d="M 580 145 L 510 188 L 595 165 Z"
          fill="url(#bubbleFill)" fill-opacity="0"
          stroke="#E8B14C" stroke-width="2" stroke-linejoin="round"
          stroke-dasharray="180" stroke-dashoffset="180">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="0.35s" begin="3.4s" fill="freeze"/>
      <animate attributeName="fill-opacity" from="0" to="1" dur="0.3s" begin="3.6s" fill="freeze"/>
    </path>

    <!-- 打字机文字：> ask. brew ideas. (18 字符) -->
    <!-- 起始 x=608 居中（气泡内 580-1010 宽 430，文字宽约 18*14=252，左 89 padding）-->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" font-weight="500" fill="#F5E6D3">
      <text x="608" y="150" opacity="0">&gt;<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.0s" fill="freeze"/></text>
      <text x="628" y="150" opacity="0"> <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.08s" fill="freeze"/></text>
      <text x="640" y="150" opacity="0">a<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.16s" fill="freeze"/></text>
      <text x="656" y="150" opacity="0">s<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.24s" fill="freeze"/></text>
      <text x="672" y="150" opacity="0">k<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.32s" fill="freeze"/></text>
      <text x="689" y="150" opacity="0">.<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.40s" fill="freeze"/></text>
      <text x="698" y="150" opacity="0"> <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.48s" fill="freeze"/></text>
      <text x="710" y="150" opacity="0">b<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.56s" fill="freeze"/></text>
      <text x="727" y="150" opacity="0">r<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.64s" fill="freeze"/></text>
      <text x="739" y="150" opacity="0">e<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.72s" fill="freeze"/></text>
      <text x="755" y="150" opacity="0">w<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.80s" fill="freeze"/></text>
      <text x="774" y="150" opacity="0"> <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.88s" fill="freeze"/></text>
      <text x="786" y="150" opacity="0">i<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.96s" fill="freeze"/></text>
      <text x="794" y="150" opacity="0">d<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="5.04s" fill="freeze"/></text>
      <text x="810" y="150" opacity="0">e<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="5.12s" fill="freeze"/></text>
      <text x="826" y="150" opacity="0">a<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="5.20s" fill="freeze"/></text>
      <text x="842" y="150" opacity="0">s<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="5.28s" fill="freeze"/></text>
      <text x="858" y="150" opacity="0">.<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="5.36s" fill="freeze"/></text>
    </g>

    <!-- 打字机光标（持续闪烁，位置在最后一个 . 之后） -->
    <rect x="869" y="130" width="2" height="28" fill="#E8B14C" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.9s" begin="4.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ======================== 右侧辅助元素（往左挪 70-100px） ======================== -->
  <g id="right-side">
    <!-- 小对话气泡（带 ✓）：x 1110→1030 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="5.0s" fill="freeze"/>
      <rect x="1030" y="230" width="130" height="58" rx="16" ry="16"
            fill="#2A1B0E" fill-opacity="0.88" stroke="#C4956C" stroke-width="1.5"/>
      <path d="M 1050 260 L 1060 268 L 1076 252" fill="none" stroke="#FF6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="1086" y1="262" x2="1146" y2="262" stroke="#F5E6D3" stroke-width="1" opacity="0.7"/>
      <line x1="1050" y1="275" x2="1136" y2="275" stroke="#F5E6D3" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- AI 波形：x 1110→1020 -->
    <g>
      <path d="M 1020 150 L 1028 120 L 1036 165 L 1044 105 L 1052 170 L 1060 125 L 1068 150"
            fill="none" stroke="#E8B14C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
        <animate attributeName="opacity" from="0" to="0.9" dur="0.4s" begin="5.2s" fill="freeze"/>
        <animate attributeName="stroke-dasharray" values="400;200;400" dur="2.4s" begin="5.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 闪烁光点：整体左移 ~100px -->
    <g fill="#F4C2A1">
      <circle cx="1050" cy="65" r="2">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="5.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="85" r="2.2">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="5.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1130" cy="55" r="1.6">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="5.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1070" cy="40" r="1.6">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1155" cy="100" r="1.4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="6.0s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ======================== 角标（ChatCafe 文字标识） ======================== -->
  <g id="brand" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="70" y="370" font-size="13" letter-spacing="3" fill="#C4956C" opacity="0">
      CHATCAFE · OPEN SOURCE
      <animate attributeName="opacity" from="0" to="0.75" dur="0.6s" begin="5.8s" fill="freeze"/>
    </text>
  </g>

</svg>
