server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # API 后端：/api/* → chatcafe-api:9091
    location /api/ {
        proxy_pass http://chatcafe-api:9091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 媒体文件：/media/* → 本地挂载
    location /media/ {
        alias /usr/src/app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 管理后台：/admin/* → chatcafe-admin:80
    location /admin/ {
        proxy_pass http://chatcafe-admin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 移动端：/* → chatcafe-mobile:80
    location / {
        proxy_pass http://chatcafe-mobile:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
